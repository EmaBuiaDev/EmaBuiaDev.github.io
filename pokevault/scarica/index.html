<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scarica PoketCards</title>
    <meta name="description" content="Scarica PoketCards, l'app per collezionare carte Pokémon in italiano. Gratis su Android.">
    <!-- Pagina di passaggio per il QR dei mazzi esportati: non serve in Google. -->
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://emabuiadev.github.io/pokevault/">
    <link rel="icon" type="image/svg+xml" href="/pokevault/icon.svg">
    <meta name="theme-color" content="#1A1A2E">
    <script>
        // Il QR stampato sui mazzi esportati porta qui. Android va dritto al
        // Play Store; iPhone e computer restano sulla pagina. Quando esce
        // l'app iOS basta riempire IOS_URL.
        (function () {
            var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.emabuia.pokevault&referrer=utm_source%3Dqr_mazzo';
            var IOS_URL = '';
            var ua = navigator.userAgent || '';
            var isIos = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (/Android/i.test(ua)) { location.replace(PLAY_URL); }
            else if (isIos && IOS_URL) { location.replace(IOS_URL); }
            else if (isIos) { document.documentElement.className = 'ios'; }
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1A1A2E;
            color: #B0B0C0;
            line-height: 1.55;
            padding: 56px 16px;
            text-align: center;
        }
        .container { max-width: 480px; margin: 0 auto; }
        .logo {
            display: block;
            width: 96px;
            height: 96px;
            border-radius: 26px;
            margin: 0 auto 24px;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 12px 40px rgba(139, 92, 246, 0.35);
        }
        h1 { color: #FFFFFF; font-size: 30px; line-height: 1.2; margin-bottom: 10px; }
        .tagline { font-size: 17px; margin-bottom: 28px; }
        .cta {
            display: inline-block;
            background: #4A6CF7;
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
        }
        .qr-box { margin-top: 36px; }
        .qr {
            width: 200px;
            height: 200px;
            border-radius: 14px;
            padding: 10px;
            background: #FFFFFF;
        }
        .qr-box p { margin-top: 12px; font-size: 14px; }
        .ios-note {
            display: none;
            margin: 0 auto 24px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(139, 92, 246, 0.14);
            color: #FFFFFF;
            font-size: 15px;
        }
        .ios .ios-note { display: block; }
        .ios .qr-box { display: none; }
        footer { margin-top: 48px; font-size: 13px; }
        footer a { color: #8E83D9; }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="/pokevault/icon.svg" alt="PoketCards" width="96" height="96">
        <h1>PoketCards</h1>
        <p class="tagline">La tua collezione di carte Pokémon in italiano: valore Cardmarket, scanner, scambi con chi è vicino, mazzi e Competitive Lab.</p>
        <p class="ios-note">Presto anche su iPhone. Intanto PoketCards è gratis su Android.</p>
        <a class="cta" href="https://play.google.com/store/apps/details?id=com.emabuia.pokevault&amp;referrer=utm_source%3Dqr_mazzo">Scarica gratis su Google Play</a>

        </div>
        <footer><a href="/pokevault/">Scopri l'app</a></footer>
    </div>
